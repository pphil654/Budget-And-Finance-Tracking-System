spring.application.name=bfts

# Database Connection (XAMPP MySQL)
spring.datasource.url=jdbc:mysql://localhost:3306/bfts_db?useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Auto Table Generation
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Disable Thymeleaf cache for live UI changes
spring.thymeleaf.cache=false