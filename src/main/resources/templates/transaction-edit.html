<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Edit Transaction | Project Track PH</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <style>
        body {
            background-color: #f4f4f4;
            font-family: Arial, sans-serif;
        }

        .navbar {
            background-color: #ba181b;
            padding: 15px 25px;
        }

        .navbar-brand {
            color: #ffca3a;
            font-weight: bold;
        }

        .navbar-brand:hover {
            color: #ffffff;
        }

        .page-container {
            max-width: 750px;
            margin: 40px auto;
            padding: 0 15px;
        }

        .form-card {
            background-color: #ffffff;
            border-radius: 10px;
            padding: 30px;
            box-shadow: 0 3px 12px rgba(0, 0, 0, 0.08);
        }

        .page-title {
            color: #ba181b;
            font-weight: bold;
            margin-bottom: 25px;
        }

        .form-label {
            font-weight: 600;
        }

        .btn-save {
            background-color: #ba181b;
            color: #ffffff;
            border: none;
        }

        .btn-save:hover {
            background-color: #941416;
            color: #ffffff;
        }

        .required {
            color: #ba181b;
        }
    </style>
</head>

<body>

    <!-- Navigation -->
    <nav class="navbar">
        <a class="navbar-brand text-decoration-none" th:href="@{/dashboard}">
            Project Track PH
        </a>
    </nav>

    <!-- Edit Form -->
    <div class="page-container">

        <div class="form-card">

            <h2 class="page-title">Edit Transaction</h2>

            <p class="text-muted">
                Update the expense details below.
            </p>

            <!-- Error Message -->
            <div th:if="${error != null}"
                 class="alert alert-danger"
                 th:text="${error}">
            </div>

            <form th:action="@{/transactions/update/{id}(id=${transaction.id})}"
                  method="post">

                <!-- Project -->
                <div class="mb-3">

                    <label for="projectId" class="form-label">
                        Project <span class="required">*</span>
                    </label>

                    <select id="projectId"
                            name="projectId"
                            class="form-select"
                            required>

                        <option value="">Select Project</option>

                        <option th:each="project : ${projects}"
                                th:value="${project.id}"
                                th:text="${project.projectCode + ' - ' + project.projectName}"
                                th:selected="${project.id == transaction.project.id}">
                        </option>

                    </select>

                </div>

                <!-- Transaction Type: Expense Only -->
                <div class="mb-3">

                    <label for="transactionType" class="form-label">
                        Transaction Type
                    </label>

                    <select id="transactionType"
                            name="transactionType"
                            class="form-select"
                            required>

                        <option value="EXPENSE" selected>
                            Expense
                        </option>

                    </select>

                </div>

                <!-- Amount -->
                <div class="mb-3">

                    <label for="amount" class="form-label">
                        Amount (₱) <span class="required">*</span>
                    </label>

                    <input type="number"
                           id="amount"
                           name="amount"
                           class="form-control"
                           min="0.01"
                           step="0.01"
                           th:value="${transaction.amount}"
                           required>

                </div>

                <!-- Description -->
                <div class="mb-3">

                    <label for="description" class="form-label">
                        Description <span class="required">*</span>
                    </label>

                    <textarea id="description"
                              name="description"
                              class="form-control"
                              rows="3"
                              placeholder="Enter expense description"
                              required
                              th:text="${transaction.description}"></textarea>

                </div>

                <!-- Transaction Date -->
                <div class="mb-4">

                    <label for="transactionDate" class="form-label">
                        Transaction Date <span class="required">*</span>
                    </label>

                    <input type="date"
                           id="transactionDate"
                           name="transactionDate"
                           class="form-control"
                           th:value="${transaction.transactionDate}"
                           required>

                </div>

                <!-- Buttons -->
                <div class="d-flex justify-content-between gap-2">

                    <a th:href="@{/transactions}"
                       class="btn btn-secondary">
                        Cancel
                    </a>

                    <button type="submit" class="btn btn-save">
                        Save Changes
                    </button>

                </div>

            </form>

        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
