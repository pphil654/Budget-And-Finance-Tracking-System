<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Add Transaction - Project Track PH</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
          rel="stylesheet">

</head>

<body class="bg-light">

    <!-- Navigation -->

    <nav class="navbar navbar-dark bg-dark">

        <div class="container-fluid px-4">

            <a class="navbar-brand fw-bold"
               href="/dashboard">

                PROJECT TRACK PH

            </a>

            <a href="/transactions"
               class="btn btn-outline-light btn-sm">

                Back to Transactions

            </a>

        </div>

    </nav>


    <!-- Form -->

    <div class="container my-5">

        <div class="row justify-content-center">

            <div class="col-md-7">

                <div class="card shadow-sm">

                    <div class="card-body p-4">

                        <h3 class="mb-4">
                            Add Financial Transaction
                        </h3>


                        <!-- Error Message -->

                        <div th:if="${error}"
                             class="alert alert-danger">

                            <span th:text="${error}">
                                Error
                            </span>

                        </div>


                        <form action="/transactions/save"
                              method="post">


                            <!-- Project -->

                            <div class="mb-3">

                                <label for="projectId"
                                       class="form-label">

                                    Project

                                </label>

                                <select id="projectId"
                                        name="projectId"
                                        class="form-select"
                                        required>

                                    <option value="">
                                        Select Project
                                    </option>

                                    <option th:each="project : ${projects}"
                                            th:value="${project.id}"
                                            th:text="${project.projectCode + ' - ' + project.projectName}">

                                        PRJ-001 - Sample Project

                                    </option>

                                </select>

                            </div>


                            <!-- Transaction Type -->

                            <div class="mb-3">

                                <label for="transactionType"
                                       class="form-label">

                                    Transaction Type

                                </label>

                                <select id="transactionType"
                                        name="transactionType"
                                        class="form-select"
                                        required>

                                    <option value="">
                                        Select Type
                                    </option>

                                    <option value="INCOME">
                                        Income
                                    </option>

                                    <option value="EXPENSE">
                                        Expense
                                    </option>

                                </select>

                            </div>


                            <!-- Amount -->

                            <div class="mb-3">

                                <label for="amount"
                                       class="form-label">

                                    Amount

                                </label>

                                <div class="input-group">

                                    <span class="input-group-text">
                                        ₱
                                    </span>

                                    <input type="number"
                                           id="amount"
                                           name="amount"
                                           class="form-control"
                                           min="0.01"
                                           step="0.01"
                                           placeholder="0.00"
                                           required>

                                </div>

                            </div>


                            <!-- Description -->

                            <div class="mb-3">

                                <label for="description"
                                       class="form-label">

                                    Description

                                </label>

                                <textarea id="description"
                                          name="description"
                                          class="form-control"
                                          rows="3"
                                          placeholder="Enter transaction description"
                                          required></textarea>

                            </div>


                            <!-- Transaction Date -->

                            <div class="mb-4">

                                <label for="transactionDate"
                                       class="form-label">

                                    Transaction Date

                                </label>

                                <input type="date"
                                       id="transactionDate"
                                       name="transactionDate"
                                       class="form-control"
                                       required>

                            </div>


                            <!-- Buttons -->

                            <div class="d-flex justify-content-end gap-2">

                                <a href="/transactions"
                                   class="btn btn-secondary">

                                    Cancel

                                </a>

                                <button type="submit"
                                        class="btn btn-primary">

                                    Save Transaction

                                </button>

                            </div>

                        </form>

                    </div>

                </div>

            </div>

        </div>

    </div>

</body>

</html>
